<title id="t">kocayinsec. Builds web and mobile products, studies how they break.</title>
<desc id="d">A line drawing of an owl on a branch, in ivory and copper, beside the name kocayinsec. The owl is drawn stroke by stroke, opens its eyes and now and then looks across at the name.</desc>
